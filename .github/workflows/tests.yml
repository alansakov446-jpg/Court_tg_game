name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: court
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: court_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U court -d court_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://court:test_only@localhost:5432/court_test
      TEST_DATABASE_URL: postgresql+asyncpg://court:test_only@localhost:5432/court_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m unittest discover -s tests -v
      - run: alembic downgrade base && alembic upgrade head
