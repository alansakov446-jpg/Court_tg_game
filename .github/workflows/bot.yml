name: Court bot
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Recovery trigger only. A healthy run queues its successor itself because
    # GitHub's cron has previously arrived 3–7 hours late in this repository.
    - cron: '*/30 * * * *'
permissions:
  contents: read
  # Needed only for the final workflow_dispatch hand-off to the next window.
  actions: write
concurrency:
  group: court-telegram-poller
  cancel-in-progress: false
jobs:
  bot:
    runs-on: ubuntu-latest
    # Poll for 50 minutes, leaving 8 minutes for setup, reports and the hand-off.
    timeout-minutes: 58
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API: ${{ secrets.GEMINI_API }}
      RUN_SECONDS: '3000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Restore Telegram offset
        # Fallback only: since alembic revision 0002 the database copy in
        # bot_state is the source of truth; the cache file only seeds it.
        uses: actions/cache/restore@v4
        with:
          path: .offset
          key: court-offset-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: court-offset-
      - run: pip install -r requirements.txt
      # Unit tests no longer run inside the polling window: they live in tests.yml,
      # so the scheduled run spends its minutes on polling instead.
      - run: alembic upgrade head
      - name: Poll Telegram updates
        # shell: bash enables pipefail, so a crashed poller still fails this step.
        shell: bash
        run: python main.py 2>&1 | tee poll.log
      - name: Save Telegram offset
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .offset
          key: court-offset-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate polling health
        # A green run must mean the bot really polled: fail the run when the
        # window produced zero completed get_updates cycles (busy lock included).
        if: always()
        shell: bash
        run: |
          if [ ! -s poll.log ]; then
            echo 'FAIL: poll.log is empty — the poller produced no output at all.'
            exit 1
          fi
          if [ ! -f health.json ]; then
            echo 'FAIL: health.json was never written — the poller did not reach its health bookkeeping.'
            exit 1
          fi
          if ! jq -e '.poll_cycles >= 1' health.json > /dev/null; then
            echo 'FAIL: zero completed get_updates cycles in this window.'
            jq -r '"lock=\(.lock) status=\(.status) start_lag=\(.start_lag)"' health.json
            exit 1
          fi
          echo "OK: $(jq -r '.poll_cycles' health.json) poll cycles, $(jq -r '.updates_handled' health.json) updates handled."
      - name: Report poller health
        if: always()
        shell: bash
        run: |
          {
            echo '## Poller health'
            echo ''
            if [ -f health.json ]; then
              echo '```'
              jq -r '"bot: \(.bot // "unknown")\npoll cycles: \(.poll_cycles)\nupdates seen/handled: \(.updates_seen)/\(.updates_handled)\nwindow (UTC): \(.started_at) .. \(.stopped_at // "running")\nlock=\(.lock) offset=\(.offset // "n/a") (source: \(.offset_source // "unknown")) pending_lag=\(.pending_lag) start_lag=\(.start_lag) status=\(.status)"' health.json
              echo '```'
              echo ''
              echo '`pending_lag` is the largest distance between the newest pending update and the offset seen during the window.'
              echo '`start_lag` is the backlog already queued in Telegram when the window opened (the gap between windows).'
            else
              echo 'health.json is missing — the poller never reached its polling loop.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report AI diagnostics
        # A green run does not mean the AI worked: failures are logged, not raised.
        if: always()
        shell: bash
        run: |
          [ -f poll.log ] || exit 0
          lines=$(grep -E 'court\.(ai|game)' poll.log | grep -E ' (WARNING|ERROR) ' | tail -n 40 || true)
          total=$(printf '%s' "$lines" | grep -c . || true)
          life=$(grep -E 'Lobby opened|Case draft accepted|Case created|New case was not created|Polling started|Polling stopped|Another worker|Another Telegram|Health polls=|Bot looks dead' poll.log || true)
          {
            echo '## AI diagnostics'
            echo ''
            if [ "$total" -eq 0 ]; then
              echo 'No AI warnings or errors in this polling window.'
            else
              echo "Found $total AI warning/error line(s) in this run:"
              echo ''
              echo '```'
              printf '%s\n' "$lines"
              echo '```'
            fi
            echo ''
            echo '### Case lifecycle in this window'
            echo ''
            if [ -n "$life" ]; then
              echo '```'
              printf '%s\n' "$life"
              echo '```'
            else
              echo 'No game activity in this window.'
            fi
            echo ''
            echo 'A started party is confirmed by a `Case created game=...` line above.'
            echo 'Logged: model, HTTP status, provider error code and message (keys redacted),'
            echo 'timeout class, JSON validation reason. Prompts, answers and player data are never logged.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload poller log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poller-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            poll.log
            health.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Explain normal poller exit
        # Printed only when the health validator above confirmed real polling.
        if: success()
        shell: bash
        run: |
          jq -e '.poll_cycles >= 1' health.json > /dev/null || exit 1
          {
            echo '## Telegram polling window completed'
            echo ''
            echo 'This run polls Telegram for up to 3000 seconds and then exits successfully;'
            echo 'the health validator has confirmed at least one completed get_updates cycle.'
            echo 'The final step queues the next window immediately; the 30-minute cron is only recovery.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Queue next polling window
        # workflow_dispatch events created with GITHUB_TOKEN are allowed to start
        # workflows. concurrency keeps one poller active and one hand-off pending.
        # Queue even after a transient failure so cron delay cannot put the bot to sleep.
        if: ${{ always() && github.ref_name == github.event.repository.default_branch }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f health.json ] && [ "$(jq -r '.lock // empty' health.json)" = 'busy' ]; then
            echo 'Another long-running poller owns the lock; not creating an Actions retry loop.'
            exit 0
          fi
          for attempt in 1 2 3; do
            if gh workflow run bot.yml --ref "$GITHUB_REF_NAME"; then
              echo "Queued the next polling window (attempt $attempt)."
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo 'Failed to queue the next polling window; the recovery cron remains enabled.'
          exit 1
